<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кинотеатр</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #111; color: #fff; }
    input { padding: 10px; width: 300px; }
    button { padding: 10px 20px; }
    #results { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .movie { cursor: pointer; border: 1px solid #333; padding: 10px; width: 150px; }
    .movie img { width: 100%; height: 225px; object-fit: cover; background: #333; }
    video { width: 100%; max-width: 800px; margin-top: 20px; display: block; }
  </style>
</head>
<body>

<h1>🎬 Кинотеатр</h1>
<input id="searchInput" placeholder="Введите название фильма или сериала">
<button onclick="search()">Найти</button>
<div id="results"></div>
<video id="player" controls></video>

<script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
<script>
// =====================================================
// ТВОИ ДАННЫЕ

let currentTorrent = null;

function getUserId() {
  let id = localStorage.getItem('userId');
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem('userId', id);
  }
  return id;
}

// ===== ПОИСК =====
window.search = async function() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return alert('Введите название');

  const container = document.getElementById('results');
  container.innerHTML = '<p>⏳ Поиск...</p>';

  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    if (!Array.isArray(data)) throw new Error('API вернул не массив');

    if (data.length === 0) {
      container.innerHTML = '<p>😕 Ничего не найдено</p>';
      return;
    }

    container.innerHTML = data.map(item => `
      <div class="movie" onclick="playMovie('${item.magnet}', '${item.title}')">
        <img src="${item.poster || 'https://placehold.co/150x225/333/fff?text=Нет+постера'}" 
             onerror="this.src='https://placehold.co/150x225/333/fff?text=Нет+постера'">
        <p><strong>${item.title || 'Без названия'}</strong><br>${item.year || ''}</p>
        <p style="font-size:12px;color:#888;">⚡${item.seeders || 0} сидов</p>
      </div>
    `).join('');

  } catch (error) {
    console.error('Ошибка поиска:', error);
    container.innerHTML = '<p>❌ Ошибка поиска. Попробуйте позже.</p>';
  }
};

// ===== ПЛЕЕР =====
window.playMovie = function(magnet, title) {
  console.log('🎬 Клик по:', title);
  console.log('🧲 Magnet:', magnet);

  if (!magnet) {
    alert('Нет magnet-ссылки для этого фильма');
    return;
  }

  const video = document.getElementById('player');

  if (currentTorrent) {
    currentTorrent.destroy();
    currentTorrent = null;
  }

  const client = new WebTorrent();
  video.innerHTML = '<p>⏳ Загрузка торрента...</p>';

  client.add(magnet, function(torrent) {
    currentTorrent = torrent;
    console.log('✅ Торрент загружен, файлов:', torrent.files.length);

    const file = torrent.files.find(f => 
      f.name.endsWith('.mp4') || 
      f.name.endsWith('.mkv') || 
      f.name.endsWith('.avi')
    );

    if (!file) {
      alert('Видеофайл не найден в этом торренте');
      return;
    }

    console.log('🎥 Найден файл:', file.name);
    file.createReadStream().pipe(video);
    video.play();
  });
};
</script>
</body>
</html>
