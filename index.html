<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Кинотеатр</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #111; color: #fff; min-height: 100vh; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
    input { padding: 12px 16px; width: 350px; max-width: 100%; border: 1px solid #333; background: #222; color: #fff; border-radius: 6px; font-size: 16px; }
    input:focus { outline: none; border-color: #ff6600; }
    button { padding: 12px 24px; background: #ff6600; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #ff5500; }

    #results { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 10px; }
    .movie { cursor: pointer; border: 1px solid #333; border-radius: 8px; padding: 10px; width: 180px; background: #1a1a1a; transition: border 0.2s; }
    .movie:hover { border-color: #ff6600; }
    .movie img { width: 100%; height: 260px; object-fit: cover; border-radius: 4px; background: #2a2a2a; }
    .movie p { margin-top: 8px; font-size: 14px; }
    .movie .year { color: #888; font-size: 12px; }

    #player-container { width: 100%; max-width: 900px; margin-top: 30px; display: none; }
    #player { width: 100%; background: #000; border-radius: 8px; max-height: 600px; }
    .status-msg { padding: 20px; text-align: center; color: #aaa; font-size: 18px; }
    .error-msg { color: #ff4444; text-align: center; padding: 20px; }
    .video-info { margin-top: 10px; padding: 10px; background: #1a1a1a; border-radius: 6px; }
    .video-info h2 { font-size: 20px; }
    .video-info p { color: #aaa; font-size: 14px; margin-top: 5px; }
  </style>
</head>
<body>

<h1>🎬 Мой Кинотеатр</h1>
<div class="search-box">
  <input id="searchInput" placeholder="Введите название фильма или сериала" />
  <button onclick="search()">Найти</button>
</div>
<div id="results"></div>

<div id="player-container">
  <video id="player" controls></video>
  <div class="video-info" id="videoInfo"></div>
</div>

<script>
// =============================================
// ПОИСК
// =============================================
window.search = async function() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { alert('Введите название'); return; }

  const container = document.getElementById('results');
  container.innerHTML = '<div class="status-msg">⏳ Поиск...</div>';

  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) {
      container.innerHTML = '<div class="status-msg">😕 Ничего не найдено</div>';
      return;
    }

    container.innerHTML = data.map(item => `
      <div class="movie" onclick="playVideo('${item.videoUrl}', '${item.title}', '${item.year}', '${item.description}', '${item.poster}')">
        <img src="${item.poster || 'https://placehold.co/180x260/333/fff?text=Нет+постера'}" 
             onerror="this.src='https://placehold.co/180x260/333/fff?text=Нет+постера'" />
        <p><strong>${item.title}</strong></p>
        <p class="year">${item.year || ''}</p>
      </div>
    `).join('');

  } catch (error) {
    console.error('Ошибка:', error);
    container.innerHTML = '<div class="error-msg">❌ Ошибка поиска</div>';
  }
};

// =============================================
// ПЛЕЕР — ТВОЙ СОБСТВЕННЫЙ
// =============================================
window.playVideo = function(videoUrl, title, year, description, poster) {
  console.log('🎬 Воспроизведение:', title);
  console.log('🔗 Ссылка:', videoUrl);

  const container = document.getElementById('player-container');
  const video = document.getElementById('player');
  const info = document.getElementById('videoInfo');

  if (!videoUrl) {
    alert('Нет ссылки на видео');
    return;
  }

  // Показываем контейнер
  container.style.display = 'block';

  // Очищаем и настраиваем видео
  video.innerHTML = '';
  video.controls = true;

  // Пробуем разные форматы
  const formats = [
    { type: 'video/mp4' },
    { type: 'video/webm' },
    { type: 'application/vnd.apple.mpegurl' } // m3u8
  ];

  for (const fmt of formats) {
    const source = document.createElement('source');
    source.src = videoUrl;
    source.type = fmt.type;
    video.appendChild(source);
  }

  video.load();
  video.play();

  // Информация о фильме
  info.innerHTML = `
    <h2>${title} ${year ? '(' + year + ')' : ''}</h2>
    ${poster ? `<img src="${poster}" style="max-width:150px;float:left;margin-right:15px;border-radius:4px;" />` : ''}
    <p>${description || 'Описание отсутствует'}</p>
    <div style="clear:both;"></div>
  `;

  // Скрываем результаты поиска
  document.getElementById('results').innerHTML = `<div class="status-msg">▶️ Сейчас играет: ${title}</div>`;
};
</script>
</body>
</html>
