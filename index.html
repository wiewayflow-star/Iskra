<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Кинотеатр — без рекламы!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #111; color: #fff; min-height: 100vh; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    h1 span { color: #ff6600; font-size: 14px; background: #222; padding: 4px 12px; border-radius: 20px; margin-left: 10px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
    input { padding: 12px 16px; width: 350px; max-width: 100%; border: 1px solid #333; background: #222; color: #fff; border-radius: 6px; font-size: 16px; }
    input:focus { outline: none; border-color: #ff6600; }
    button { padding: 12px 24px; background: #ff6600; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ff5500; }

    #results { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 10px; }
    .movie { cursor: pointer; border: 1px solid #333; border-radius: 8px; padding: 10px; width: 180px; background: #1a1a1a; transition: border 0.2s, transform 0.15s; }
    .movie:hover { border-color: #ff6600; transform: scale(1.03); }
    .movie img { width: 100%; height: 260px; object-fit: cover; border-radius: 4px; background: #2a2a2a; }
    .movie p { margin-top: 8px; font-size: 14px; }
    .movie .year { color: #888; font-size: 12px; }

    #player-container {
      width: 100%;
      max-width: 900px;
      margin-top: 30px;
      display: none;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    
    #player-container iframe {
      width: 100%;
      height: 500px;
      border: none;
      display: block;
    }

    #video-info { padding: 15px; background: #1a1a1a; border-top: 1px solid #333; }
    #video-info h2 { font-size: 20px; }
    #video-info p { color: #aaa; font-size: 14px; margin-top: 5px; }
    
    .status-msg { padding: 20px; text-align: center; color: #aaa; font-size: 18px; }
    .error-msg { color: #ff4444; text-align: center; padding: 20px; }
    .badge { display: inline-block; background: #ff6600; color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 12px; margin-left: 10px; }
  </style>
</head>
<body>

<h1>🎬 Мой Кинотеатр <span>🔒 Без рекламы</span></h1>
<div class="search-box">
  <input id="searchInput" placeholder="Введите название фильма или сериала" />
  <button onclick="search()">Найти</button>
</div>
<div id="results"></div>

<div id="player-container">
  <iframe id="player" src="" allowfullscreen></iframe>
  <div id="video-info">
    <h2 id="film-title">Название фильма</h2>
    <p id="film-desc">Описание...</p>
  </div>
</div>

<script>
// =============================================
// ПОИСК
// =============================================
window.search = async function() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { alert('Введите название'); return; }

  const container = document.getElementById('results');
  container.innerHTML = '<div class="status-msg">⏳ Поиск...</div>';

  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) {
      container.innerHTML = '<div class="status-msg">😕 Ничего не найдено</div>';
      return;
    }

    container.innerHTML = data.map(item => `
      <div class="movie" onclick="playVideo('${item.videoUrl}', '${item.title}', '${item.year}', '${item.poster}')">
        <img src="${item.poster || 'https://placehold.co/180x260/333/fff?text=Нет+постера'}" 
             onerror="this.src='https://placehold.co/180x260/333/fff?text=Нет+постера'" />
        <p><strong>${item.title}</strong></p>
        <p class="year">${item.year || ''}</p>
      </div>
    `).join('');

  } catch (error) {
    console.error('Ошибка:', error);
    container.innerHTML = '<div class="error-msg">❌ Ошибка поиска</div>';
  }
};

// =============================================
// ПЛЕЕР — IFRAME С МАСКИРОВКОЙ
// =============================================
window.playVideo = function(iframeUrl, title, year, poster) {
  console.log('🎬 Воспроизведение:', title);
  console.log('🔗 Iframe:', iframeUrl);

  const container = document.getElementById('player-container');
  const iframe = document.getElementById('player');
  const titleEl = document.getElementById('film-title');
  const descEl = document.getElementById('film-desc');

  if (!iframeUrl) {
    alert('❌ Не удалось найти плеер');
    return;
  }

  container.style.display = 'block';

  // Вставляем iframe
  iframe.src = iframeUrl;

  // Информация о фильме
  titleEl.textContent = `${title} ${year ? '(' + year + ')' : ''}`;
  descEl.textContent = '🎥 Видео загружается...';

  // Скрываем результаты поиска
  document.getElementById('results').innerHTML = `
    <div class="status-msg">
      ▶️ Сейчас играет: <strong>${title}</strong> 
      <span class="badge">Без рекламы</span>
    </div>
  `;
};

console.log('✅ Кинотеатр загружен. Введите название и нажмите "Найти".');
</script>
</body>
</html>
