<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Мой Кинотеатр</title>
    <!-- Подключаем стили, которые ты скачал -->
    <link rel="stylesheet" href="css/cinema.css">
    <style>
        /* Дополнительные стили для маскировки */
        .iframe-wrapper {
            width: 100%;
            height: 600px;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            position: relative;
        }
        .iframe-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            /* Смещаем так, чтобы скрыть шапку и меню iframe.cloud */
            margin-top: -80px; /* Скрываем верхнюю часть */
            clip-path: inset(80px 0px 0px 0px);
        }
        /* Убираем всё лишнее на iframe.cloud с помощью CSS (работает в некоторых браузерах) */
        .iframe-wrapper iframe body {
            margin: 0;
        }
        @media (max-width: 768px) {
            .iframe-wrapper {
                height: 300px;
            }
            .iframe-wrapper iframe {
                margin-top: -60px;
                clip-path: inset(60px 0px 0px 0px);
            }
        }
        /* Остальные стили твоего дизайна уже есть в cinema.css */
    </style>
</head>
<body>
    <!-- Шапка твоего сайта (из скачанного дизайна) -->
    <header class="header header-centered">
        <a href="index.html" class="logo">
            <span class="logo-icon">▶</span>
        </a>
        <nav class="nav nav-centered">
            <a href="#" class="nav-link active" data-tab="popular">Популярное</a>
            <a href="#" class="nav-link" data-tab="top">Топ 250</a>
            <a href="#" class="nav-link" data-tab="favorites">Избранное</a>
        </nav>
    </header>

    <!-- Основной контент -->
    <main class="main">
        <!-- Поиск (твой дизайн) -->
        <section class="hero" id="heroSection">
            <div class="hero-content">
                <div class="hero-search">
                    <div class="hero-search-box">
                        <span class="hero-search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="Найти фильм или сериал..." autocomplete="off">
                        <div class="search-results" id="searchResults"></div>
                    </div>
                </div>
                <h1 class="hero-title">Смотрите фильмы <span class="gradient-text">бесплатно</span></h1>
                <p class="hero-subtitle">Огромная коллекция фильмов и сериалов в HD качестве</p>
                <div class="hero-stats">
                    <div class="stat"><span class="stat-value">50K+</span><span class="stat-label">Фильмов</span></div>
                    <div class="stat"><span class="stat-value">1080p</span><span class="stat-label">Качество</span></div>
                    <div class="stat"><span class="stat-value">0₽</span><span class="stat-label">Бесплатно</span></div>
                </div>
            </div>
        </section>

        <!-- Контейнер для iframe -->
        <section class="movies-section" id="moviesSection">
            <div class="section-header">
                <h2 class="section-title" id="sectionTitle">🔥 Популярные фильмы</h2>
            </div>
            <div class="iframe-wrapper">
                <iframe id="playerFrame" src="https://iframe.cloud" allowfullscreen></iframe>
            </div>
        </section>
    </main>

    <!-- Футер -->
    <footer class="footer">
        <p>© 2026 Мой Кинотеатр</p>
    </footer>

    <!-- JavaScript для поиска -->
    <script>
        // =============================================
        // ПОИСК
        // =============================================
        const searchInput = document.getElementById('searchInput');
        const playerFrame = document.getElementById('playerFrame');
        const resultsContainer = document.getElementById('searchResults');

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query.length >= 2) {
                    // Открываем iframe с поиском на iframe.cloud
                    const url = `https://iframe.cloud/search?q=${encodeURIComponent(query)}`;
                    playerFrame.src = url;
                    // Обновляем заголовок
                    document.getElementById('sectionTitle').textContent = `🔍 Результаты поиска: "${query}"`;
                    // Скрываем выпадающий список
                    resultsContainer.innerHTML = '';
                }
            }
        });

        // Автодополнение (как на iframe.cloud)
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            if (query.length < 2) {
                resultsContainer.innerHTML = '';
                return;
            }
            // Здесь можно было бы сделать запрос к API для автодополнения,
            // но мы просто показываем сообщение о поиске
            resultsContainer.innerHTML = `
                <div class="search-loading">Поиск "${query}"...</div>
            `;
            // Через секунду убираем (имитация)
            clearTimeout(this._timeout);
            this._timeout = setTimeout(() => {
                resultsContainer.innerHTML = `
                    <div class="search-item" onclick="document.getElementById('searchInput').value='${query}'; document.getElementById('searchInput').dispatchEvent(new KeyboardEvent('keydown', {key:'Enter'}));">
                        <span class="search-item-title">Найти "${query}"</span>
                    </div>
                `;
            }, 300);
        });

        // Клик по результату автодополнения
        document.addEventListener('click', function(e) {
            if (e.target.closest('.search-item')) {
                // уже обработано в onclick
            }
        });

        // Табы (популярное, топ, избранное)
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                let url = 'https://iframe.cloud';
                if (tab === 'popular') url = 'https://iframe.cloud';
                else if (tab === 'top') url = 'https://iframe.cloud/top';
                else if (tab === 'favorites') url = 'https://iframe.cloud/favorites';
                playerFrame.src = url;
                document.getElementById('sectionTitle').textContent = this.textContent;
            });
        });

        // При загрузке страницы показываем популярное
        playerFrame.src = 'https://iframe.cloud';
        console.log('🎬 Кинотеатр загружен!');
    </script>
</body>
</html>
