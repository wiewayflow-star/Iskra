<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 Кинотеатр — бесплатно и без рекламы</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }
    
    /* ===== ШАПКА ===== */
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 2px solid #ff6600;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 {
      font-size: 26px;
      color: #ff6600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 span { color: #fff; font-weight: 300; }
    .header .badge {
      font-size: 12px;
      background: #ff6600;
      color: #fff;
      padding: 2px 12px;
      border-radius: 20px;
      font-weight: bold;
    }
    .search-box { display: flex; gap: 10px; flex-wrap: wrap; }
    .search-box input {
      padding: 10px 16px;
      width: 300px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      transition: border 0.3s;
    }
    .search-box input:focus {
      outline: none;
      border-color: #ff6600;
      background: #222;
    }
    .search-box button {
      padding: 10px 24px;
      background: #ff6600;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .search-box button:hover { background: #e65c00; }

    /* ===== ПЛЕЕР ===== */
    #player-container {
      width: 100%;
      max-width: 1100px;
      margin: 20px auto;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(255, 102, 0, 0.05);
      min-height: 500px;
    }
    #player-container iframe {
      width: 100%;
      height: 600px;
      border: none;
      display: block;
    }

    /* ===== ИНФОРМАЦИОННАЯ ПАНЕЛЬ ===== */
    .info-bar {
      padding: 15px 25px;
      background: #1a1a1a;
      border-top: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .info-bar .title { font-size: 18px; font-weight: bold; }
    .info-bar .title span { color: #ff6600; }
    .info-bar .status { color: #888; font-size: 14px; }

    /* ===== ПЛЕЙСХОЛДЕР ===== */
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 600px;
      color: #555;
      font-size: 18px;
      gap: 15px;
      text-align: center;
      padding: 20px;
    }
    .placeholder .icon { font-size: 70px; }
    .placeholder .sub { font-size: 14px; color: #444; }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 700px) {
      .header { flex-direction: column; align-items: stretch; }
      .search-box input { width: 100%; }
      #player-container iframe { height: 300px; }
      .placeholder { height: 300px; }
      .info-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>
    🎬 <span>Кинотеатр</span>
    <span class="badge">🔒 Без рекламы</span>
  </h1>
  <div class="search-box">
    <input id="searchInput" placeholder="Название фильма или сериала..." />
    <button onclick="search()">🔍 Найти</button>
  </div>
</div>

<div id="player-container">
  <div class="placeholder" id="placeholder">
    <div class="icon">🎥</div>
    <div>Введите название и нажмите «Найти»</div>
    <div class="sub">Бесплатные фильмы и сериалы в HD качестве</div>
  </div>
  <iframe id="player" src="" allowfullscreen style="display:none;"></iframe>
</div>

<div class="info-bar">
  <div class="title">🎞️ <span id="filmTitle">Выберите фильм</span></div>
  <div class="status" id="status">Готов к поиску</div>
</div>

<script>
// =============================================
// ГЛАВНАЯ ФУНКЦИЯ ПОИСКА
// =============================================
function search() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) {
    alert('Введите название фильма');
    return;
  }

  // Формируем URL для iframe.cloud
  const searchUrl = `https://iframe.cloud/search?q=${encodeURIComponent(query)}`;
  
  const iframe = document.getElementById('player');
  const placeholder = document.getElementById('placeholder');
  
  // Показываем iframe, скрываем плейсхолдер
  iframe.style.display = 'block';
  placeholder.style.display = 'none';
  
  // Загружаем поиск
  iframe.src = searchUrl;
  
  // Обновляем информацию
  document.getElementById('filmTitle').textContent = `«${query}»`;
  document.getElementById('status').textContent = `🔍 Поиск на iframe.cloud...`;
  
  // Когда iframe загрузится
  iframe.onload = function() {
    document.getElementById('status').textContent = `✅ Результаты поиска «${query}»`;
  };
}

// =============================================
// ГОРЯЧАЯ КЛАВИША ENTER
// =============================================
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') search();
});

// =============================================
// ПРИВЕТСТВИЕ В КОНСОЛИ
// =============================================
console.log('🎬 Кинотеатр загружен!');
console.log('🔍 Введи название фильма и нажми "Найти"');
console.log('📺 Все видео берутся с iframe.cloud');
</script>
</body>
</html>
