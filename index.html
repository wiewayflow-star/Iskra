<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кинотеатр</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
    
    .header { 
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
      border-bottom: 2px solid #ff6600;
    }
    .header h1 { font-size: 24px; color: #ff6600; }
    .header h1 span { color: #fff; font-weight: 300; }
    .search-box { display: flex; gap: 10px; flex-wrap: wrap; }
    .search-box input { 
      padding: 10px 16px; 
      width: 280px; 
      border: 1px solid #333; 
      background: #1a1a1a; 
      color: #fff; 
      border-radius: 6px; 
      font-size: 14px; 
    }
    .search-box input:focus { outline: none; border-color: #ff6600; }
    .search-box button { 
      padding: 10px 24px; 
      background: #ff6600; 
      color: #fff; 
      border: none; 
      border-radius: 6px; 
      font-size: 14px; 
      cursor: pointer; 
      font-weight: bold;
    }
    .search-box button:hover { background: #ff5500; }

    #player-container {
      width: 100%;
      max-width: 1100px;
      margin: 20px auto;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255, 102, 0, 0.1);
    }
    #player-container iframe {
      width: 100%;
      height: 600px;
      border: none;
      display: block;
    }

    .info-bar {
      padding: 15px 20px;
      background: #1a1a1a;
      border-top: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .info-bar .title { font-size: 18px; font-weight: bold; }
    .info-bar .title span { color: #ff6600; }
    .info-bar .status { color: #888; font-size: 14px; }

    .sources {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 20px;
      background: #111;
      border-top: 1px solid #222;
    }
    .sources button {
      padding: 6px 14px;
      background: #222;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .sources button:hover, .sources button.active {
      background: #ff6600;
      color: #fff;
      border-color: #ff6600;
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 600px;
      color: #444;
      font-size: 20px;
      flex-direction: column;
      gap: 15px;
    }
    .placeholder .icon { font-size: 60px; }

    @media (max-width: 700px) {
      .header { flex-direction: column; align-items: stretch; }
      .search-box input { width: 100%; }
      #player-container iframe { height: 300px; }
      .placeholder { height: 300px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🎬 <span>Кинотеатр</span></h1>
  <div class="search-box">
    <input id="searchInput" placeholder="Название фильма..." />
    <button onclick="search()">Найти</button>
  </div>
</div>

<div id="player-container">
  <div class="placeholder" id="placeholder">
    <div class="icon">🎥</div>
    <div>Введите название и нажмите «Найти»</div>
    <div style="font-size:14px;color:#666;">Выберите источник ниже</div>
  </div>
  <iframe id="player" src="" allowfullscreen style="display:none;"></iframe>
</div>

<div class="sources" id="sourcesBar">
  <button class="active" onclick="setSource('kinokong')">Kinokong</button>
  <button onclick="setSource('seasonvar')">Seasonvar</button>
  <button onclick="setSource('rezka')">Rezka</button>
  <button onclick="setSource('kinogo')">Kinogo</button>
  <button onclick="setSource('hdrezka')">HDRezka</button>
</div>

<div class="info-bar">
  <div class="title">🎞️ <span id="filmTitle">Выберите фильм</span></div>
  <div class="status" id="status">Готов к поиску</div>
</div>

<script>
// =============================================
// НАСТРОЙКИ
// =============================================
let currentSource = 'kinokong';

const SITES = {
  kinokong: {
    name: 'Kinokong',
    search: (q) => `https://kinokong.org/search?q=${encodeURIComponent(q)}`
  },
  seasonvar: {
    name: 'Seasonvar',
    search: (q) => `https://seasonvar.ru/search/?q=${encodeURIComponent(q)}`
  },
  rezka: {
    name: 'Rezka',
    search: (q) => `https://rezka.ag/search/?do=search&subaction=search&q=${encodeURIComponent(q)}`
  },
  kinogo: {
    name: 'Kinogo',
    search: (q) => `https://kinogo.biz/search/${encodeURIComponent(q)}`
  },
  hdrezka: {
    name: 'HDRezka',
    search: (q) => `https://hdrezka.ag/search/?do=search&subaction=search&q=${encodeURIComponent(q)}`
  }
};

// =============================================
// ВЫБОР ИСТОЧНИКА
// =============================================
function setSource(name) {
  currentSource = name;
  document.querySelectorAll('.sources button').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.sources button[onclick="setSource('${name}')"]`).classList.add('active');
  document.getElementById('status').textContent = `🔍 Источник: ${SITES[name].name}`;
  
  // Если уже был поиск — перезапускаем
  const query = document.getElementById('searchInput').value.trim();
  if (query) search();
}

// =============================================
// ПОИСК
// =============================================
function search() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { alert('Введите название'); return; }

  const site = SITES[currentSource];
  const searchUrl = site.search(query);
  
  const iframe = document.getElementById('player');
  const placeholder = document.getElementById('placeholder');
  
  // Показываем iframe, скрываем плейсхолдер
  iframe.style.display = 'block';
  placeholder.style.display = 'none';
  
  // Вставляем поиск
  iframe.src = searchUrl;
  
  document.getElementById('filmTitle').textContent = `«${query}» (поиск на ${site.name})`;
  document.getElementById('status').textContent = `🔍 Поиск на ${site.name}...`;
  
  // При загрузке iframe
  iframe.onload = function() {
    document.getElementById('status').textContent = `✅ Результаты поиска «${query}» на ${site.name}`;
  };
}

// =============================================
// ГОРЯЧАЯ КЛАВИША ENTER
// =============================================
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') search();
});

console.log('✅ Кинотеатр загружен. Выбери источник и введи название.');
</script>
</body>
</html>
