<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кинотеатр</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #111; color: #fff; min-height: 100vh; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input { padding: 12px 16px; width: 350px; max-width: 100%; border: 1px solid #333; background: #222; color: #fff; border-radius: 6px; font-size: 16px; }
    input:focus { outline: none; border-color: #ff6600; }
    button { padding: 12px 24px; background: #ff6600; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #ff5500; }
    #player { width: 100%; height: 600px; border: none; border-radius: 8px; background: #000; margin-top: 10px; }
    .hint { color: #666; font-size: 14px; margin-top: 10px; }
    .status { padding: 10px; color: #aaa; }
    .links { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .links a { color: #ff6600; text-decoration: none; padding: 6px 12px; border: 1px solid #333; border-radius: 4px; }
    .links a:hover { background: #222; }
  </style>
</head>
<body>

<h1>🎬 Кинотеатр</h1>
<div class="search-box">
  <input id="searchInput" placeholder="Введите название фильма или сериала" />
  <button onclick="search()">Найти</button>
</div>

<div class="links">
  <a href="#" onclick="setSite('kinokong')">Kinokong</a>
  <a href="#" onclick="setSite('seasonvar')">Seasonvar</a>
  <a href="#" onclick="setSite('rezka')">Rezka</a>
  <a href="#" onclick="setSite('kinogo')">Kinogo</a>
</div>

<iframe id="player" src=""></iframe>
<div class="status" id="status">Введите название и нажмите "Найти"</div>

<script>
// Список пиратских сайтов для поиска
const SITES = {
  kinokong: {
    name: 'Kinokong',
    url: 'https://kinokong.org/search?q='
  },
  seasonvar: {
    name: 'Seasonvar',
    url: 'https://seasonvar.ru/search/?q='
  },
  rezka: {
    name: 'Rezka',
    url: 'https://rezka.ag/search/?do=search&subaction=search&q='
  },
  kinogo: {
    name: 'Kinogo',
    url: 'https://kinogo.biz/search/'
  }
};

let currentSite = 'kinokong';

function setSite(site) {
  currentSite = site;
  document.getElementById('status').textContent = `🔍 Поиск на ${SITES[site].name}`;
  // Если уже есть поисковый запрос, перезапускаем поиск
  const query = document.getElementById('searchInput').value.trim();
  if (query) performSearch(query);
}

function search() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { alert('Введите название'); return; }
  performSearch(query);
}

function performSearch(query) {
  const site = SITES[currentSite];
  const url = site.url + encodeURIComponent(query);
  const iframe = document.getElementById('player');
  iframe.src = url;
  document.getElementById('status').textContent = `🔍 Поиск "${query}" на ${site.name}...`;
  
  // Добавляем обработчик загрузки iframe
  iframe.onload = function() {
    document.getElementById('status').textContent = `✅ Показан результат поиска "${query}" на ${site.name}`;
  };
}

// Автоматически устанавливаем первый сайт
document.getElementById('status').textContent = 'Выберите сайт и введите название';

console.log('✅ Кинотеатр загружен. Используй кнопки выше для выбора сайта.');
</script>
</body>
</html>
