<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 Мой Кинотеатр</title>
  <style>
    /* ===== ВАШ ДИЗАЙН ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 30px;
      background: #12121a;
      padding: 15px 25px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b00, #ff4500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo span { -webkit-text-fill-color: #fff; font-weight: 300; }
    .search-box {
      display: flex;
      gap: 10px;
      flex: 1;
      max-width: 500px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 18px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      border-radius: 8px;
      font-size: 16px;
      transition: 0.3s;
    }
    .search-box input:focus {
      outline: none;
      border-color: #ff4500;
      box-shadow: 0 0 20px rgba(255, 69, 0, 0.1);
    }
    .search-box button {
      padding: 12px 24px;
      background: #ff4500;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .search-box button:hover { background: #e63e00; }

    .source-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .source-btn {
      padding: 8px 18px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      color: #aaa;
      cursor: pointer;
      transition: 0.2s;
    }
    .source-btn.active {
      background: #ff4500;
      border-color: #ff4500;
      color: #fff;
    }
    .source-btn:hover { border-color: #ff4500; }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 25px;
      margin: 20px 0;
    }
    .movie-card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: 1px solid #2a2a2a;
    }
    .movie-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 10px 30px rgba(255, 69, 0, 0.2);
      border-color: #ff4500;
    }
    .movie-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background: #2a2a2a;
    }
    .movie-card .info {
      padding: 12px;
    }
    .movie-card .info h3 {
      font-size: 16px;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .movie-card .info .year {
      color: #888;
      font-size: 14px;
    }

    #player-container {
      margin-top: 30px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: none;
      position: relative;
      padding-bottom: 56.25%; /* 16:9 */
      height: 0;
    }
    #player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .loader {
      text-align: center;
      padding: 40px;
      color: #aaa;
    }
    .loader .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top-color: #ff4500;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty {
      text-align: center;
      padding: 40px;
      color: #666;
      font-size: 18px;
    }
    .status-msg {
      padding: 15px;
      background: #1a1a1a;
      border-radius: 8px;
      margin: 10px 0;
      color: #aaa;
      text-align: center;
    }
    @media (max-width: 600px) {
      .header { flex-direction: column; align-items: stretch; }
      .search-box { max-width: 100%; }
      #results { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🎬 <span>Кинотеатр</span></div>
    <div class="search-box">
      <input id="searchInput" placeholder="Название фильма..." />
      <button id="searchBtn">Найти</button>
    </div>
  </div>

  <div class="source-selector">
    <button class="source-btn active" data-source="kodik">Kodik</button>
    <button class="source-btn" data-source="alloha">Alloha</button>
    <button class="source-btn" data-source="hdvb">HDVB</button>
  </div>

  <div id="results"></div>

  <div id="player-container">
    <iframe id="playerFrame" allowfullscreen></iframe>
  </div>

  <script>
    // =============================================
    // КОНФИГУРАЦИЯ ИСТОЧНИКОВ
    // =============================================
    const SOURCES = {
      kodik: {
        name: 'Kodik',
        search: async (query) => {
          const url = `https://kodik.cc/api/search?q=${encodeURIComponent(query)}`;
          const res = await fetch(url);
          const data = await res.json();
          if (!data.results) return [];
          return data.results.map(item => ({
            id: item.id,
            title: item.title,
            year: item.year,
            poster: item.poster || item.poster_url || '',
            iframe: item.iframe_src || `https://kodik.cc/serial/${item.id}/720p`
          }));
        }
      },
      alloha: {
        name: 'Alloha',
        search: async (query) => {
          // Alloha не имеет публичного API, используем парсинг страницы поиска
          const url = `https://alloha.tv/search/?q=${encodeURIComponent(query)}`;
          const res = await fetch(url);
          const html = await res.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const items = doc.querySelectorAll('.movie-item');
          return Array.from(items).map(el => {
            const link = el.querySelector('a');
            const id = link?.href?.split('/').pop() || '';
            const title = link?.textContent?.trim() || '';
            const poster = el.querySelector('img')?.src || '';
            return {
              id,
              title,
              year: '',
              poster,
              iframe: `https://alloha.tv/player/${id}?quality=1080`
            };
          }).filter(item => item.id);
        }
      },
      hdvb: {
        name: 'HDVB',
        search: async (query) => {
          // HDVB (бывший HDVideoBox) также требует парсинга
          const url = `https://hdvb.cc/search/?q=${encodeURIComponent(query)}`;
          const res = await fetch(url);
          const html = await res.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const items = doc.querySelectorAll('.search-result');
          return Array.from(items).map(el => {
            const link = el.querySelector('a');
            const id = link?.href?.split('/').pop() || '';
            const title = link?.textContent?.trim() || '';
            const poster = el.querySelector('img')?.src || '';
            return {
              id,
              title,
              year: '',
              poster,
              iframe: `https://hdvb.cc/embed/${id}`
            };
          }).filter(item => item.id);
        }
      }
    };

    let currentSource = 'kodik';
    let currentResults = [];

    // =============================================
    // ВЫБОР ИСТОЧНИКА
    // =============================================
    document.querySelectorAll('.source-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.source-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentSource = this.dataset.source;
        const query = document.getElementById('searchInput').value.trim();
        if (query) search(query);
      });
    });

    // =============================================
    // ПОИСК
    // =============================================
    async function search(query) {
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = `<div class="loader"><div class="spinner"></div><p>Поиск на ${SOURCES[currentSource].name}...</p></div>`;

      try {
        const source = SOURCES[currentSource];
        const results = await source.search(query);
        currentResults = results;
        renderResults(results);
      } catch (error) {
        console.error('Ошибка поиска:', error);
        resultsContainer.innerHTML = `<div class="empty">❌ Ошибка загрузки. Попробуйте другой источник.</div>`;
      }
    }

    // =============================================
    // ОТОБРАЖЕНИЕ РЕЗУЛЬТАТОВ
    // =============================================
    function renderResults(results) {
      const container = document.getElementById('results');
      if (!results || results.length === 0) {
        container.innerHTML = `<div class="empty">😕 Ничего не найдено</div>`;
        return;
      }

      container.innerHTML = results.map(item => `
        <div class="movie-card" onclick="playMovie('${item.iframe}', '${item.title}')">
          <img src="${item.poster || 'https://placehold.co/180x260/333/fff?text=Нет+постера'}" 
               onerror="this.src='https://placehold.co/180x260/333/fff?text=Нет+постера'" 
               alt="${item.title}" loading="lazy">
          <div class="info">
            <h3>${item.title}</h3>
            <span class="year">${item.year || ''}</span>
          </div>
        </div>
      `).join('');
    }

    // =============================================
    // ВОСПРОИЗВЕДЕНИЕ (IFRAME)
    // =============================================
    function playMovie(iframeSrc, title) {
      const container = document.getElementById('player-container');
      const frame = document.getElementById('playerFrame');
      frame.src = iframeSrc;
      container.style.display = 'block';
      // Прокручиваем к плееру
      container.scrollIntoView({ behavior: 'smooth', block: 'start' });
      // Показываем сообщение в заголовке
      document.querySelector('.logo span').textContent = `▶ ${title}`;
    }

    // =============================================
    // ОБРАБОТЧИКИ СОБЫТИЙ
    // =============================================
    document.getElementById('searchBtn').addEventListener('click', function() {
      const query = document.getElementById('searchInput').value.trim();
      if (query.length >= 2) search(query);
    });

    document.getElementById('searchInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const query = this.value.trim();
        if (query.length >= 2) search(query);
      }
    });

    // =============================================
    // ПРИВЕТСТВИЕ
    // =============================================
    console.log('🎬 Кинотеатр загружен. Введите название и нажмите "Найти".');
    console.log('Источники: Kodik (основной), Alloha, HDVB (запасные)');
  </script>
</body>
</html>
