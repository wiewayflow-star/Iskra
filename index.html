<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Кинотеатр — без рекламы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #0d0d0d, #1a1a2e);
            padding: 16px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #ff4500;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header .logo {
            font-size: 26px;
            font-weight: 800;
            color: #ff4500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .logo span { color: #fff; font-weight: 300; }
        .header .badge {
            background: #ff4500;
            color: #fff;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .search-box { display: flex; gap: 8px; flex-wrap: wrap; }
        .search-box input {
            padding: 10px 18px;
            width: 320px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: #ff4500;
            background: #222;
        }
        .search-box button {
            padding: 10px 24px;
            background: #ff4500;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .search-box button:hover { background: #e63e00; }

        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        #results {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }
        .movie {
            cursor: pointer;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 12px;
            width: 180px;
            background: #1a1a1a;
            transition: all 0.2s;
        }
        .movie:hover {
            border-color: #ff4500;
            transform: scale(1.03);
        }
        .movie img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 6px;
            background: #2a2a2a;
        }
        .movie p {
            margin-top: 8px;
            font-size: 14px;
            text-align: center;
        }

        #player-container {
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }
        #player {
            width: 100%;
            max-height: 600px;
            display: block;
            background: #000;
        }
        .info-bar {
            padding: 15px 20px;
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .info-bar .title { font-size: 18px; font-weight: 600; }
        .info-bar .title span { color: #ff4500; }
        .info-bar .status { color: #888; font-size: 13px; }

        .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 400px;
            color: #555;
            text-align: center;
            gap: 15px;
        }
        .placeholder .icon { font-size: 60px; }

        @media (max-width: 700px) {
            .header { flex-direction: column; align-items: stretch; }
            .search-box input { width: 100%; }
            .movie { width: 140px; }
            .movie img { height: 200px; }
            #player { max-height: 300px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">🎬 <span>Кинотеатр</span> <span class="badge">🔒 Без рекламы</span></div>
    <div class="search-box">
        <input id="searchInput" placeholder="Название фильма..." />
        <button onclick="search()">🔍 Найти</button>
    </div>
</div>

<div class="container">
    <div id="results"></div>

    <div id="player-container">
        <video id="player" controls></video>
        <div class="info-bar">
            <div class="title">🎞️ <span id="filmTitle">Выберите фильм</span></div>
            <div class="status" id="status">Готов к просмотру</div>
        </div>
    </div>

    <div class="placeholder" id="placeholder">
        <div class="icon">🎥</div>
        <h2>Введите название и нажмите «Найти»</h2>
        <p>Видео в твоём плеере, без рекламы</p>
    </div>
</div>

<script>
// =============================================
// ПОИСК
// =============================================
window.search = async function() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) { alert('Введите название'); return; }

    const container = document.getElementById('results');
    container.innerHTML = '<p style="color:#aaa;">⏳ Поиск...</p>';

    try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
            container.innerHTML = '<p style="color:#aaa;">😕 Ничего не найдено</p>';
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="movie" onclick="playVideo('${item.videoUrl}', '${item.title}', '${item.poster}', '${item.description}')">
                <img src="${item.poster || 'https://placehold.co/180x260/333/fff?text=Нет+постера'}" 
                     onerror="this.src='https://placehold.co/180x260/333/fff?text=Нет+постера'" />
                <p><strong>${item.title}</strong></p>
            </div>
        `).join('');

    } catch (error) {
        console.error('Ошибка:', error);
        container.innerHTML = '<p style="color:#ff4444;">❌ Ошибка поиска</p>';
    }
};

// =============================================
// ПЛЕЕР — ТВОЙ, ВОРУЕТ ВИДЕО
// =============================================
window.playVideo = function(videoUrl, title, poster, description) {
    console.log('🎬 Воспроизведение:', title);
    console.log('🔗 Ссылка на видео:', videoUrl);

    const container = document.getElementById('player-container');
    const video = document.getElementById('player');
    const titleEl = document.getElementById('filmTitle');
    const statusEl = document.getElementById('status');
    const placeholder = document.getElementById('placeholder');

    if (!videoUrl) {
        alert('❌ Ссылка на видео не найдена');
        return;
    }

    container.style.display = 'block';
    placeholder.style.display = 'none';

    // Очищаем и настраиваем видео
    video.innerHTML = '';
    video.controls = true;

    // Добавляем источник
    const source = document.createElement('source');
    source.src = videoUrl;
    source.type = 'video/mp4';
    video.appendChild(source);

    // Если это m3u8, используем hls.js
    if (videoUrl.endsWith('.m3u8') && typeof Hls !== 'undefined') {
        const hls = new Hls();
        hls.loadSource(videoUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else {
        video.load();
        video.play().catch(e => console.warn('Автовоспроизведение заблокировано:', e));
    }

    titleEl.textContent = title;
    statusEl.textContent = '▶️ Сейчас играет';
    document.getElementById('results').innerHTML = `<p style="color:#aaa;">▶️ Сейчас играет: <strong>${title}</strong></p>`;
};

// =============================================
// ENTER
// =============================================
document.getElementById('searchInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') search();
});

console.log('🎬 Кинотеатр загружен. Видео воруем с iframe.cloud!');
</script>

<!-- Подключаем hls.js для m3u8 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</body>
</html>
