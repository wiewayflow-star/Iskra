<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кинотеатр</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #111; color: #fff; }
    input { padding: 10px; width: 300px; }
    button { padding: 10px 20px; }
    #results { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
    .movie { cursor: pointer; border: 1px solid #333; padding: 10px; width: 150px; }
    .movie img { width: 100%; }
    video { width: 100%; max-width: 800px; margin-top: 20px; display: block; }
  </style>
</head>
<body>

<h1>🎬 Кинотеатр</h1>
<input id="searchInput" placeholder="Введите название фильма или сериала">
<button onclick="search()">Найти</button>
<div id="results"></div>
<video id="player" controls></video>

<script src="https://cdn.jsdelivr.net/npm/webtorrent@latest/webtorrent.min.js"></script>
<script>
// =====================================================
// ТВОИ ДАННЫЕ УЖЕ ВСТАВЛЕНЫ
// =====================================================
const SUPABASE_URL = 'https://oitthmhpguzzaqzudris.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pdHRobWhwZ3V6emFxenVkcmlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwODYwMzQsImV4cCI6MjEwMDY2MjAzNH0.jbZKmwpXCloK_-FfeSRdkVT63wohS2_5CVYB2vGpBS0';
// =====================================================

let currentTorrent = null;
let currentVideo = null;

function getUserId() {
  let id = localStorage.getItem('userId');
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem('userId', id);
  }
  return id;
}

async function search() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return alert('Введите название');
  
  const res = await fetch(`/api/torrentclaw?q=${encodeURIComponent(query)}`);
  const data = await res.json();
  
  const container = document.getElementById('results');
  if (!data || data.length === 0) {
    container.innerHTML = '<p>Ничего не найдено</p>';
    return;
  }
  
  container.innerHTML = data.map(item => `
    <div class="movie" onclick="playMovie('${item.magnet}', '${item.title}')">
      <img src="${item.poster || ''}" onerror="this.src='https://via.placeholder.com/150x225?text=Нет+постера'">
      <p><strong>${item.title}</strong><br>${item.year || ''}</p>
    </div>
  `).join('');
}

async function playMovie(magnet, title) {
  const video = document.getElementById('player');
  const userId = getUserId();
  const contentId = title;
  
  if (currentTorrent) {
    currentTorrent.destroy();
    currentTorrent = null;
  }
  
  const savedTime = await loadProgress(userId, contentId);
  
  const client = new WebTorrent();
  
  client.add(magnet, function(torrent) {
    currentTorrent = torrent;
    
    const file = torrent.files.find(f => 
      f.name.endsWith('.mp4') || 
      f.name.endsWith('.mkv') || 
      f.name.endsWith('.avi')
    );
    
    if (!file) {
      alert('Видеофайл не найден в этом торренте');
      return;
    }
    
    file.createReadStream().pipe(video);
    video.currentTime = savedTime || 0;
    video.play();
    
    video.ontimeupdate = function() {
      const current = Math.floor(video.currentTime);
      if (current % 5 === 0 && current > 0) {
        saveProgress(userId, contentId, current);
      }
    };
    
    video.onpause = function() {
      saveProgress(userId, contentId, Math.floor(video.currentTime));
    };
  });
}

async function saveProgress(userId, contentId, timestamp) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/user_progress`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({
        user_id: userId,
        content_id: contentId,
        timestamp: timestamp,
        updated_at: new Date().toISOString()
      })
    });
  } catch (e) {
    console.error('Ошибка сохранения прогресса:', e);
  }
}

async function loadProgress(userId, contentId) {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/user_progress?user_id=eq.${userId}&content_id=eq.${encodeURIComponent(contentId)}&select=timestamp`,
      { headers: { 'apikey': SUPABASE_KEY } }
    );
    const data = await res.json();
    return data.length > 0 ? data[0].timestamp : 0;
  } catch (e) {
    console.error('Ошибка загрузки прогресса:', e);
    return 0;
  }
}
</script>
</body>
</html>
