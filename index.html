<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Кинотеатр</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #111; color: #fff; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    input { padding: 12px 16px; width: 350px; max-width: 100%; border: 1px solid #333; background: #222; color: #fff; border-radius: 6px; font-size: 16px; }
    input:focus { outline: none; border-color: #ff6600; }
    button { padding: 12px 24px; background: #ff6600; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #ff5500; }
    #player-container { 
      width: 100%; 
      max-width: 1000px; 
      margin: 20px auto; 
      background: #000; 
      border-radius: 8px; 
      overflow: hidden;
      position: relative;
    }
    #player-container iframe {
      width: 100%;
      height: 600px;
      border: none;
      display: block;
    }
    .status { padding: 15px; text-align: center; color: #aaa; }
    .loading { text-align: center; padding: 40px; color: #ff6600; }
  </style>
</head>
<body>

<h1>🎬 Мой Кинотеатр</h1>
<div class="search-box">
  <input id="searchInput" placeholder="Введите название фильма или сериала" />
  <button onclick="search()">Найти</button>
</div>

<div id="player-container">
  <div class="status" id="status">Введите название и нажмите "Найти"</div>
</div>

<script>
// Список пиратских сайтов (рабочие домены на июль 2026)
const SITES = [
  {
    name: 'Kinokong',
    search: (q) => `https://kinokong.org/search?q=${encodeURIComponent(q)}`,
    embed: (id) => `https://kinokong.org/embed/${id}`
  },
  {
    name: 'Seasonvar',
    search: (q) => `https://seasonvar.ru/search/?q=${encodeURIComponent(q)}`
  },
  {
    name: 'Rezka',
    search: (q) => `https://rezka.ag/search/?do=search&subaction=search&q=${encodeURIComponent(q)}`
  },
  {
    name: 'Kinogo',
    search: (q) => `https://kinogo.biz/search/${encodeURIComponent(q)}`
  }
];

let currentSite = 0; // Начинаем с Kinokong

window.search = async function() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { alert('Введите название'); return; }

  const container = document.getElementById('player-container');
  const status = document.getElementById('status');

  // Показываем загрузку
  container.innerHTML = `<div class="loading">⏳ Ищем "${query}"...</div>`;

  // Пробуем каждый сайт по очереди
  for (let i = 0; i < SITES.length; i++) {
    const site = SITES[i];
    try {
      const searchUrl = site.search(query);
      status.textContent = `🔍 Пробуем ${site.name}...`;

      // Пытаемся загрузить страницу поиска
      const response = await fetch(`/api/proxy?url=${encodeURIComponent(searchUrl)}`);
      
      if (response.ok) {
        const html = await response.text();
        // Ищем ссылку на фильм (упрощённо)
        const match = html.match(/href="\/([^"]+-(?:[0-9]+|sezon|season))"/i);
        if (match) {
          const filmId = match[1];
          // Пытаемся найти embed-ссылку
          const embedUrl = `https://kinokong.org/embed/${filmId}`;
          container.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
          status.textContent = `▶️ Сейчас играет: ${query}`;
          return;
        }
      }
    } catch (e) {
      console.warn(`${site.name} не сработал:`, e);
    }
  }

  // Если ничего не нашли — показываем iframe с поиском на первом сайте
  const fallbackUrl = SITES[0].search(query);
  container.innerHTML = `
    <iframe src="${fallbackUrl}" allowfullscreen></iframe>
  `;
  status.textContent = `🔍 Результаты поиска "${query}" (внешний сайт)`;
};
</script>
</body>
</html>
