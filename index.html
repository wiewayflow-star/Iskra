<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Кинотеатр</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #111; color: #fff; }
    h1 { margin-bottom: 20px; font-size: 28px; }
    .search-box { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
    input { padding: 12px 16px; width: 350px; max-width: 100%; border: 1px solid #333; background: #222; color: #fff; border-radius: 6px; font-size: 16px; }
    input:focus { outline: none; border-color: #ff6600; }
    button { padding: 12px 24px; background: #ff6600; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #ff5500; }
    #results { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 10px; }
    .movie { cursor: pointer; border: 1px solid #333; border-radius: 8px; padding: 10px; width: 160px; background: #1a1a1a; text-align: center; }
    .movie:hover { border-color: #ff6600; }
    .movie img { width: 100%; height: 225px; object-fit: cover; border-radius: 4px; background: #2a2a2a; }
    .movie p { margin-top: 8px; font-size: 14px; }
    #player { width: 100%; max-width: 900px; margin-top: 30px; display: none; background: #000; border-radius: 8px; }
    .status-msg { padding: 20px; text-align: center; color: #aaa; font-size: 18px; }
  </style>
</head>
<body>

<h1>🎬 Мой Кинотеатр</h1>
<div class="search-box">
  <input id="searchInput" placeholder="Введите название фильма или сериала" />
  <button onclick="search()">Найти</button>
</div>
<div id="results"></div>

<video id="player" controls></video>

<script>
// =============================================
// ПОИСК
// =============================================
window.search = async function() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) { alert('Введите название'); return; }

  const container = document.getElementById('results');
  container.innerHTML = '<div class="status-msg">⏳ Поиск...</div>';

  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    if (!Array.isArray(data) || data.length === 0) {
      container.innerHTML = '<div class="status-msg">😕 Ничего не найдено</div>';
      return;
    }

    container.innerHTML = data.map(item => `
      <div class="movie" onclick="playVideo('${item.videoUrl}', '${item.title}')">
        <img src="${item.poster || 'https://placehold.co/150x225/333/fff?text=Нет+постера'}" 
             onerror="this.src='https://placehold.co/150x225/333/fff?text=Нет+постера'" />
        <p><strong>${item.title}</strong></p>
      </div>
    `).join('');

  } catch (error) {
    console.error('Ошибка:', error);
    container.innerHTML = '<div class="status-msg">❌ Ошибка поиска</div>';
  }
};

// =============================================
// ПЛЕЕР — ТВОЙ СОБСТВЕННЫЙ
// =============================================
window.playVideo = function(videoUrl, title) {
  console.log('🎬 Воспроизведение:', title);
  console.log('🔗 Ссылка:', videoUrl);

  const video = document.getElementById('player');
  if (!videoUrl) {
    alert('Нет ссылки на видео');
    return;
  }

  // Очищаем и показываем видео
  video.innerHTML = '';
  video.style.display = 'block';
  video.controls = true;

  const source = document.createElement('source');
  source.src = videoUrl;
  source.type = 'video/mp4';
  video.appendChild(source);
  video.load();
  video.play();

  document.getElementById('results').innerHTML = `<div class="status-msg">▶️ Сейчас играет: ${title}</div>`;
};
</script>
</body>
</html>
